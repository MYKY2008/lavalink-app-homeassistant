name: "Lavalink"
description: "Lavalink v4 audio server pre Discord music boty. Plne konfigurovateľný cez HA UI s okamžitou inštaláciou."
version: "3.2.1"
slug: "lavalink"
init: false
arch:
  - aarch64
  - amd64
startup: services

# Host network — nutné pre bezproblémový Discord Voice UDP stream (bez Docker NAT strát)
host_network: true

hassio_api: false
homeassistant_api: false
privileged: []

map:
  - data

# =============================================================================
# KONFIGURÁCIA — viditeľná a editovateľná v HA UI (Settings → Add-ons → Lavalink → Configuration)
# =============================================================================
options:
  # --- Základné ---
  server_port: 2333
  server_password: "hFb1XfbERVLgxuuHzZuHNqIX5vwqzN2D"

  # --- JVM pamäť ---
  jvm_max_heap_mb: 512
  jvm_min_heap_mb: 256

  # --- Zdroje (sources) ---
  source_youtube: false
  source_soundcloud: true
  source_bandcamp: true
  source_twitch: true
  source_vimeo: true
  source_http: true

  # --- YouTube plugin ---
  youtube_plugin_version: "1.18.2"
  youtube_clients: "MUSIC,TV,WEBEMBEDDED,ANDROID_VR,MWEB,WEB"
  youtube_remote_cipher_url: "https://cipher.kikkia.dev/"
  youtube_oauth_enabled: false
  youtube_oauth_refresh_token: ""
  youtube_po_token: ""
  youtube_visitor_data: ""

  # --- Spotify & LavaSrc ---
  spotify_enabled: false
  spotify_client_id: ""
  spotify_client_secret: ""
  spotify_country_code: "SK"

  # --- Výkon ---
  buffer_duration_ms: 400
  frame_buffer_duration_ms: 5000
  player_update_interval: 5
  youtube_playlist_load_limit: 6

  # --- Logging ---
  log_level: "INFO"

schema:
  # --- Základné ---
  server_port: int
  server_password: str

  # --- JVM ---
  jvm_max_heap_mb: int
  jvm_min_heap_mb: int

  # --- Zdroje ---
  source_youtube: bool
  source_soundcloud: bool
  source_bandcamp: bool
  source_twitch: bool
  source_vimeo: bool
  source_http: bool

  # --- YouTube plugin ---
  youtube_plugin_version: str
  youtube_clients: str
  youtube_remote_cipher_url: str?
  youtube_oauth_enabled: bool
  youtube_oauth_refresh_token: str?
  youtube_po_token: str?
  youtube_visitor_data: str?

  # --- Spotify & LavaSrc ---
  spotify_enabled: bool
  spotify_client_id: str?
  spotify_client_secret: str?
  spotify_country_code: str?

  # --- Výkon ---
  buffer_duration_ms: int
  frame_buffer_duration_ms: int
  player_update_interval: int
  youtube_playlist_load_limit: int

  # --- Logging ---
  log_level: list(DEBUG|INFO|WARN|ERROR)
